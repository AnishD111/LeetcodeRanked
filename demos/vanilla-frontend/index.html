<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCode Ranked — Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="auth-card">
    <h1>LeetCode Ranked ⚔️</h1>

    <div class="tab-bar">
      <button id="tab-login"    class="tab active" onclick="switchTab('login')">Login</button>
      <button id="tab-register" class="tab"        onclick="switchTab('register')">Register</button>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <input id="login-email"    type="email"    placeholder="Email"    required />
      <input id="login-password" type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
      <input id="reg-username" type="text"     placeholder="Username"             required />
      <input id="reg-email"    type="email"    placeholder="Email"                required />
      <input id="reg-password" type="password" placeholder="Password (8+ chars)"  required />
      <button type="submit">Create Account</button>
    </form>

    <div class="divider">or</div>
    <a href="http://localhost:8080/api/auth/google" class="oauth-btn google">Continue with Google</a>
    <a href="http://localhost:8080/api/auth/github" class="oauth-btn github">Continue with GitHub</a>


    <p id="auth-error" class="error hidden"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
